server {
    listen 80;
    listen [::]:80;
    server_name experience.muonroi.com;

    # Cloudflare real IP ranges (IPv4 only — sufficient for proxy origin)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    root /home/phila/.experience/dashboard;

    location = / {
        return 302 /dashboard;
    }

    location = /dashboard {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /dashboard/ {
        try_files /index.html =404;
    }

    location = /dashboard/schema.md {
        default_type text/markdown;
        try_files /schema.md =404;
    }

    location = /api/snapshot.json {
        if ($http_x_dashboard_token != "TOKEN_PLACEHOLDER") {
            return 401 "missing-or-bad-token\n";
        }
        default_type application/json;
        try_files /latest.json =404;
        add_header Cache-Control "no-cache";
    }

    location ~ "^/api/snapshot/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$" {
        if ($http_x_dashboard_token != "TOKEN_PLACEHOLDER") {
            return 401 "missing-or-bad-token\n";
        }
        default_type application/json;
        alias /home/phila/.experience/dashboard/snapshots/$1.json;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/experience.muonroi.com.access.log;
    error_log  /var/log/nginx/experience.muonroi.com.error.log;
}
