# Apache vhost — experience.muonroi.com
# Serves dashboard HTML publicly + token-protected JSON API.
# TLS terminated at Cloudflare; origin uses CF-issued cert.

<VirtualHost *:80>
    ServerName experience.muonroi.com
    Redirect permanent / https://experience.muonroi.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName experience.muonroi.com

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/cloudflare-muonroi-com.pem
    SSLCertificateKeyFile /etc/ssl/private/cloudflare-muonroi-com.key

    DocumentRoot /home/phila/.experience/dashboard

    # Token check — SetEnvIf needs the LITERAL token (placeholder replaced at deploy)
    SetEnvIf X-Dashboard-Token "^TOKEN_PLACEHOLDER$" valid_token=1

    <Directory /home/phila/.experience/dashboard>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Root → /dashboard
    RedirectMatch ^/$ /dashboard

    # /dashboard → index.html (no auth). More-specific aliases MUST come
    # before the catch-all /dashboard rule — Apache picks first match.
    Alias /dashboard/schema.md /home/phila/experience-engine/tools/dashboard/schema.md
    <Directory /home/phila/experience-engine/tools/dashboard>
        Require all granted
    </Directory>
    Alias /dashboard/ /home/phila/.experience/dashboard/index.html
    Alias /dashboard /home/phila/.experience/dashboard/index.html

    <Location /dashboard>
        Require all granted
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Location>

    # /api/snapshot.json → latest.json (token required)
    Alias /api/snapshot.json /home/phila/.experience/dashboard/latest.json
    <Location /api/snapshot.json>
        Require env valid_token
        ErrorDocument 403 "missing-or-bad-token\n"
        Header set Content-Type "application/json"
        Header set Cache-Control "no-cache"
    </Location>

    # /api/sessions.csv → sessions.csv (token required)
    Alias /api/sessions.csv /home/phila/.experience/dashboard/sessions.csv
    <Location /api/sessions.csv>
        Require env valid_token
        ErrorDocument 403 "missing-or-bad-token\n"
        Header set Content-Type "text/csv; charset=utf-8"
        Header set Content-Disposition "inline; filename=\"sessions.csv\""
    </Location>

    # /api/snapshot/YYYY-MM-DD.json → snapshots/YYYY-MM-DD.json (token required)
    AliasMatch "^/api/snapshot/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$" /home/phila/.experience/dashboard/snapshots/$1.json
    <LocationMatch "^/api/snapshot/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$">
        Require env valid_token
        ErrorDocument 403 "missing-or-bad-token\n"
        Header set Content-Type "application/json"
    </LocationMatch>

    # Block any other path. Each allowed path must re-grant explicitly —
    # Apache merges nested <Location> Require directives via AND.
    <Location />
        Require all denied
    </Location>
    <Location /dashboard>
        Require all granted
    </Location>
    <Location /dashboard/schema.md>
        Require all granted
    </Location>
    <Location /api/snapshot.json>
        Require env valid_token
    </Location>
    <Location /api/sessions.csv>
        Require env valid_token
    </Location>
    <LocationMatch "^/api/snapshot/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$">
        Require env valid_token
    </LocationMatch>

    # Security headers (always set, even on errors)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/experience.muonroi.com-error.log
    CustomLog ${APACHE_LOG_DIR}/experience.muonroi.com-access.log combined
</VirtualHost>
