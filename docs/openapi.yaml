openapi: 3.1.0
info:
  title: Experience Engine API
  description: REST API for AI agent experience learning system. Zero npm dependencies.
  version: 0.8.2
  license:
    name: MIT
    url: https://github.com/muonroi/experience-engine/blob/main/LICENSE

servers:
  - url: http://localhost:8082/v1
    description: Local development server (versioned)
  - url: http://localhost:8082
    description: Local development server (unversioned, backward compat)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Set via server.authToken in ~/.experience/config.json

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, warn, degraded]
        qdrant:
          type: object
          properties:
            status:
              type: string
              enum: [ok, error, unreachable, unknown]
            code:
              type: integer
            error:
              type: string
        embed:
          type: object
          properties:
            status:
              type: string
              enum: [ok, warn, degraded, no-data, unknown]
            recentFailRate:
              type: string
            lastProvider:
              type: string
        fileStore:
          type: object
          properties:
            status:
              type: string
              enum: [ok, missing, unknown]
            path:
              type: string
        uptime:
          type: number
        alerts:
          type: array
          items:
            type: string

    InterceptRequest:
      type: object
      required: [toolName]
      properties:
        toolName:
          type: string
          description: Name of the tool being called (e.g. "Bash", "Edit")
        toolInput:
          type: object
          description: Tool input payload
        sourceKind:
          type: string
          default: manual-api
        sourceRuntime:
          type: string
          default: api
        sourceSession:
          type: string
        cwd:
          type: string

    InterceptResponse:
      type: object
      properties:
        suggestions:
          type: string
          nullable: true
          description: Formatted hint text or null if no suggestions
        hasSuggestions:
          type: boolean
        surfacedIds:
          type: array
          items:
            type: object
            properties:
              collection:
                type: string
              id:
                type: string
              solution:
                type: string
        route:
          type: object
          nullable: true
          properties:
            tier:
              type: string
              enum: [fast, balanced, premium]
            model:
              type: string
            confidence:
              type: number
            source:
              type: string

    PostToolRequest:
      type: object
      properties:
        toolName:
          type: string
        toolInput:
          type: object
        toolOutput:
          type: object
        surfacedIds:
          type: array
          items:
            type: object
        sourceKind:
          type: string
        sourceRuntime:
          type: string
        sourceSession:
          type: string

    ExtractRequest:
      type: object
      required: [transcript]
      properties:
        transcript:
          type: string
          description: Session transcript text
        projectPath:
          type: string

    FeedbackRequest:
      type: object
      required: [pointId, collection]
      properties:
        pointId:
          type: string
          description: Full UUID or 8-char prefix
        collection:
          type: string
          enum: [experience-principles, experience-behavioral, experience-selfqa]
        verdict:
          type: string
          enum: [FOLLOWED, IGNORED, IRRELEVANT]
        reason:
          type: string
          enum: [wrong_repo, wrong_language, wrong_task, stale_rule]
          description: Required when verdict is IRRELEVANT
        followed:
          type: boolean
          description: "Legacy: true=FOLLOWED, false=IGNORED"
          deprecated: true

    FeedbackResponse:
      type: object
      properties:
        ok:
          type: boolean
        resolvedId:
          type: string
        verdict:
          type: string
        reason:
          type: string

    RouteTaskRequest:
      type: object
      required: [task]
      properties:
        task:
          type: string
          maxLength: 2000
        context:
          type: object
        runtime:
          type: string

    RouteResponse:
      type: object
      properties:
        tier:
          type: string
          enum: [fast, balanced, premium]
        model:
          type: string
        reasoningEffort:
          type: string
          nullable: true
        confidence:
          type: number
        source:
          type: string
        reason:
          type: string

    RouteFeedbackRequest:
      type: object
      required: [taskHash, tier, model]
      properties:
        taskHash:
          type: string
        tier:
          type: string
        model:
          type: string
        outcome:
          type: string
        retryCount:
          type: integer
        duration:
          type: number

    EvolveResponse:
      type: object
      properties:
        promoted:
          type: integer
        abstracted:
          type: integer
        demoted:
          type: integer
        archived:
          type: integer

    StatsResponse:
      type: object
      properties:
        since:
          type: string
        totalIntercepts:
          type: integer
        suggestions:
          type: integer
        misses:
          type: integer
        totalMistakes:
          type: integer
        totalStored:
          type: integer
        extractSessions:
          type: integer
        evolveCount:
          type: integer
        promoted:
          type: integer
        demoted:
          type: integer
        abstracted:
          type: integer
        archived:
          type: integer
        projects:
          type: object

paths:
  /health:
    get:
      summary: Health check
      description: Qdrant, embed provider, and FileStore status. Always open (no auth).
      security: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /metrics:
    get:
      summary: Prometheus metrics
      description: Prometheus text format metrics for monitoring.
      security: []
      responses:
        '200':
          description: Prometheus text format
          content:
            text/plain:
              schema:
                type: string

  /api/intercept:
    post:
      summary: Query experience before tool call
      description: Returns relevant suggestions and model routing for the given tool invocation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterceptRequest'
      responses:
        '200':
          description: Suggestions and route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterceptResponse'
        '400':
          description: Missing toolName
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '429':
          description: Rate limited

  /api/posttool:
    post:
      summary: Post-tool reconciliation
      description: Records tool outcome and triggers judge evaluation of surfaced suggestions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostToolRequest'
      responses:
        '200':
          description: Reconciliation result
          content:
            application/json:
              schema:
                type: object

  /api/extract:
    post:
      summary: Extract lessons from session transcript
      description: Analyzes transcript for mistakes and stores learned experiences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractRequest'
      responses:
        '200':
          description: Extraction result
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored:
                    type: integer
                  mistakes:
                    type: integer

  /api/evolve:
    post:
      summary: Trigger evolution cycle
      description: Runs promotion (T2→T1→T0), demotion, archival, and route compaction.
      responses:
        '200':
          description: Evolution metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvolveResponse'

  /api/feedback:
    post:
      summary: Record agent feedback on suggestion
      description: Report whether a surfaced hint was followed, ignored, or irrelevant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'

  /api/stats:
    get:
      summary: Observability statistics
      description: Aggregated activity metrics. Supports ?since=7d query param.
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          schema:
            type: string
            default: 7d
        - name: all
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'

  /api/gates:
    get:
      summary: Readiness gate report
      description: Three-gate readiness assessment (Build, Dogfood, Acceptance).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gate report
          content:
            application/json:
              schema:
                type: object

  /api/user:
    get:
      summary: Current user identity
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string

  /api/route-task:
    post:
      summary: Intelligent task routing
      description: Classifies task complexity and routes to appropriate model tier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteTaskRequest'
      responses:
        '200':
          description: Route decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'

  /api/route-model:
    post:
      summary: Model tier routing
      description: Routes to specific model based on task analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteTaskRequest'
      responses:
        '200':
          description: Route decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'

  /api/route-feedback:
    post:
      summary: Route outcome feedback
      description: Records agent outcome for routing learning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteFeedbackRequest'
      responses:
        '200':
          description: Feedback recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /api/principles/share:
    post:
      summary: Export a principle
      description: Exports a principle for sharing with other instances.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principleId]
              properties:
                principleId:
                  type: string
      responses:
        '200':
          description: Shared principle data
          content:
            application/json:
              schema:
                type: object

  /api/principles/import:
    post:
      summary: Import a principle
      description: Imports a shared principle into the local brain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  principle:
                    type: string

  /api/brain:
    post:
      summary: Proxy brain LLM calls
      description: Proxies LLM calls for clients behind firewall.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                timeoutMs:
                  type: integer
                  default: 10000
      responses:
        '200':
          description: LLM response
          content:
            application/json:
              schema:
                type: object
        '502':
          description: Brain call failed

  /api/prompt-stale:
    post:
      summary: Reconcile stale prompt suggestions
      description: Cleans up prompt-only suggestions that were never acted upon.
      responses:
        '200':
          description: Reconciliation result
          content:
            application/json:
              schema:
                type: object

  /api/graph:
    get:
      summary: Experience graph edges
      description: Returns edges for an experience entry.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Graph edges
          content:
            application/json:
              schema:
                type: object

  /api/project-brief:
    get:
      summary: Project Brief (SessionStart breadth digest)
      description: >
        Returns a breadth-first, always-on digest of what the engine knows about
        a project — top-N learned entries scoped by project membership (flat
        `scope_project_slug`) plus universal `scope.lang=all` rules, ranked by
        confidence × hit-count × recency (NOT similarity). Each line is tagged
        `[id:xxxx col:name]` for lazy detail fetch. Authorized by the read token.
      parameters:
        - name: project
          in: query
          required: false
          description: Project slug. If omitted, derived from `cwd`.
          schema:
            type: string
        - name: cwd
          in: query
          required: false
          description: Working directory used to derive the project slug when `project` is absent.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: Project brief
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                    nullable: true
                    description: Formatted index (header + one line per entry), or null when empty.
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        collection: { type: string }
                        score: { type: number }
                  projectSlug:
                    type: string
                    nullable: true
                  count:
                    type: integer
    post:
      summary: Project Brief (hook transport)
      description: >
        Same as GET, for the SessionStart hook which posts via the thin-client
        transport. Requires the full auth token.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project: { type: string }
                cwd: { type: string }
                limit: { type: integer }
      responses:
        '200':
          description: Project brief
          content:
            application/json:
              schema:
                type: object

  /api/recall:
    post:
      summary: Active recall (agent-initiated self-query)
      description: >
        Agent-initiated, on-demand recall of learned experience, run in
        HYBRID SEMANTIC-SEARCH MODE. Unlike /api/search (raw vector hits, no
        signal) and unlike passive hints, recall runs TWO retrieval legs — a
        dense-vector kNN leg (semantic) and a full-text lexical leg (exact
        terms / identifiers the embedding may miss) — and fuses them per tier
        with Reciprocal Rank Fusion (the same fusion Elasticsearch uses), so an
        experience that matches strongly on EITHER leg surfaces. Recall also
        casts a wider net (recallTopK) and deliberately drops the passive-hint
        noise-control gates: the positive lang/framework/project scope filters
        and the min-search-score floor are NOT applied (that floor is a noise
        guard for hints, not a relevance ceiling for a deliberate query — so
        cross-repo / cross-language lessons can surface). The lexical leg uses a
        Qdrant full-text index on the top-level `text_search` payload field and
        degrades to empty if the index is missing (recall falls back to
        vector-only). Integrity gates STILL apply: superseded, permanent-noise
        (ignore>=20 & hit=0), irrelevant>=3, learned lang/project exclusions,
        and the min-confidence quality floor. Retrieval spans the experience
        tiers (T0 principles, T1 behavioral, T2 seeds, self-QA), is formatted
        with `[id col]` feedback handles, and records a SURFACE event per
        returned entry (bumps surfaceCount, NOT hitCount). The agent then
        reports usefulness via /api/feedback so actively pulled context
        reinforces precisely and filters noise faster than passive hints.
        Full auth token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, description: Natural-language question/context (max 10KB) }
                cwd: { type: string, description: Working dir used to derive project/lang scope }
                project_slug: { type: string }
                lang: { type: string }
                sourceSession: { type: string }
      responses:
        '200':
          description: Recall result
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                    nullable: true
                    description: Formatted experience (⚠️/💡 lines with [id col]), or null when nothing matched.
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        collection: { type: string }
                  count: { type: integer }
                  query: { type: string }
        '400':
          description: query is required / exceeds 10KB

  /api/timeline:
    get:
      summary: Semantic timeline
      description: Returns timeline of experiences related to a topic.
      parameters:
        - name: topic
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Timeline entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic:
                    type: string
                  timeline:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /api/version:
    get:
      summary: Server build fingerprint
      description: Git commit and commit date of the running server (EE_COMMIT overrides). Always open (no auth).
      security: []
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  commit:
                    type: string
                  commitDate:
                    type: [string, 'null']
                  version:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /api/projects:
    get:
      summary: Project slug directory
      description: >
        Aggregates the flat scope_project_slug across the experience collections so
        callers pick an existing project slug instead of guessing one. Cached for
        5 minutes. Read token accepted.
      responses:
        '200':
          description: Known project slugs with entry counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        count:
                          type: integer
                        collections:
                          type: object
                  unscoped:
                    type: integer
                  total:
                    type: integer
                  collections:
                    type: object
                  failed:
                    type: array
                    items:
                      type: string
                  truncated:
                    type: boolean
                  cached:
                    type: boolean
        '503':
          description: Project directory unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/hint-stats:
    get:
      summary: Hint quality stats
      description: Surfaces noisy, high-ignore and unscoped entries for noise triage (used by exp-hint-stats).
      parameters:
        - name: minIgnoreCount
          in: query
          schema:
            type: integer
            default: 2
        - name: noiseRatio
          in: query
          schema:
            type: number
            default: 0.4
        - name: topN
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: collections
          in: query
          description: Comma-separated collection names
          schema:
            type: string
      responses:
        '200':
          description: Per-collection noise stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  generatedAt:
                    type: string
                    format: date-time
                  thresholds:
                    type: object
                  stats:
                    type: object

  /api/posttool-batch:
    post:
      summary: Batched post-tool hint
      description: One intercept over a batch of tool calls, keyed on a representative file path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tools]
              properties:
                tools:
                  type: array
                  items:
                    type: object
                representativeFilePath:
                  type: string
                sessionId:
                  type: string
                cwd:
                  type: string
                sourceKind:
                  type: string
                sourceRuntime:
                  type: string
      responses:
        '200':
          description: Hint for the batch (null when nothing surfaced)
          content:
            application/json:
              schema:
                type: object
                properties:
                  hint:
                    type: [string, 'null']
                  surfacedIds:
                    type: array
                    items:
                      type: object
                  batchSize:
                    type: integer
        '400':
          description: tools missing or not an array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ingest-point:
    post:
      summary: Ingest a curated point
      description: Embeds text and upserts it directly into a known collection, bypassing extraction (backfill scripts).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, text, collection]
              properties:
                id:
                  type: string
                text:
                  type: string
                collection:
                  type: string
                payload:
                  type: object
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  collection:
                    type: string
                  success:
                    type: boolean
        '400':
          description: Validation, unknown collection, embedding or upsert failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sync-buffers:
    post:
      summary: Sync IDE buffers
      description: Hands open-editor buffers to the engine for context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buffers]
              properties:
                buffers:
                  type: object
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: buffers missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/search:
    post:
      summary: Semantic search
      description: Hybrid search over the experience collections (or a subset), without recall bookkeeping.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                limit:
                  type: integer
                  default: 5
                  maximum: 20
                collections:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Matching points
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        score:
                          type: number
                        text:
                          type: string
                        collection:
                          type: string
        '400':
          description: query missing or unknown collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Embedding unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/import-memory:
    post:
      summary: Import curated memory
      description: Stores curated MEMORY.md entries as experiences (used by `experience-engine sync`). Max 500 per call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [experiences]
              properties:
                experiences:
                  type: array
                  maxItems: 500
                  items:
                    type: object
      responses:
        '200':
          description: Import stats and per-entry results
          content:
            application/json:
              schema:
                type: object
        '400':
          description: experiences missing or too many
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/pil-context:
    post:
      summary: Prompt classification and retrieval
      description: Classification plus retrieval in one call for muonroi-cli L1. Cached for 5 minutes per prompt and locale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  maxLength: 10000
                locale_hint:
                  type: string
      responses:
        '200':
          description: Classification and context
          content:
            application/json:
              schema:
                type: object
        '400':
          description: prompt missing or over 10KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/phase-outcome:
    post:
      summary: Phase-grain reinforcement
      description: Records a GSD phase outcome. Returns 404 unless ENABLE_PHASE_OUTCOME=1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, phaseName, outcome]
              properties:
                sessionId:
                  type: string
                phaseName:
                  type: string
                outcome:
                  type: string
      responses:
        '200':
          description: Reinforcement result
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Endpoint disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/workflow-event:
    post:
      summary: Record a workflow event
      description: Stores a debate, sprint, decision or mistake event in its workflow_* collection. Returns 404 unless ENABLE_WORKFLOW_EVENT=1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, phaseRef]
              properties:
                kind:
                  type: string
                  enum: [council-debate, debate, sprint-execution, sprint, decision, mistake]
                phaseRef:
                  type: string
                text:
                  type: string
                id:
                  type: string
                sessionId:
                  type: string
                payload:
                  type: object
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
                  collection:
                    type: string
                  kind:
                    type: string
        '400':
          description: Validation failure or unknown kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Endpoint disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
