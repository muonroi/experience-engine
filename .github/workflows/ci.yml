name: ci

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: CI test suite
        run: npm run test:ci

      - name: Lint check
        run: npx eslint server.js api/ .experience/experience-core.js .experience/src/ --no-error-on-unmatched-pattern

      - name: Coverage check
        timeout-minutes: 3
        run: npx c8@8 --lines 60 --functions 50 --branches 40 --reporter=text node --test --test-concurrency=1 tests/server-*.test.js tests/interceptor.test.js tests/embedding.test.js tests/qdrant-io.test.js tests/experience-core-routing.test.js tests/experience-core-task-routing.test.js tests/experience-core-evolution.test.js tests/npm-cli.test.js

  python-sdk:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start server
        run: |
          mkdir -p ~/.experience/store/default
          echo '{"qdrantUrl":"http://localhost:6333"}' > ~/.experience/config.json
          nohup node server.js &
          sleep 3

      - name: Install SDK and run tests
        working-directory: sdk/python
        run: |
          pip install -e .
          python test_client.py

  # Smoke-test what users actually install. The test job runs against the repo
  # checkout, so a file missing from package.json "files" or the Dockerfile
  # (e.g. lib/) only shows up here.
  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Start server from packed tarball
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/pkg" && tar xzf *.tgz
          EXP_SERVER_PORT=18082 nohup node package/server.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s http://localhost:18082/health | grep -q '"status"' && exit 0
            sleep 1
          done
          cat server.log
          exit 1

  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and start image on a root-owned volume
        run: |
          docker build -t experience-engine:ci .
          # Simulate a volume written by the pre-0.9 root image.
          docker volume create ee-data
          docker run --rm -v ee-data:/data --entrypoint sh experience-engine:ci \
            -c 'mkdir -p /data/store/default && echo "{}" > /data/store/default/legacy.json'
          docker run -d --name ee -p 18082:8082 -v ee-data:/home/node/.experience experience-engine:ci
          for i in $(seq 1 30); do
            curl -s http://localhost:18082/health | grep -q '"status"' && break
            sleep 1
          done
          curl -s http://localhost:18082/health | grep -q '"status"' || { docker logs ee; exit 1; }

      - name: Server runs as node and owns the migrated data
        run: |
          test "$(docker exec ee sh -c 'stat -c %U /proc/1')" = node
          test "$(docker exec ee stat -c %U /home/node/.experience/store/default/legacy.json)" = node
